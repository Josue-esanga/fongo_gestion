{% load static tailwind_tags %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Django Tailwind</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="icon" type="image/svg+xml" href="{% static 'images/logo.svg' %}">
    {% tailwind_css %}
</head>

<body style="background-image: url('{% static 'images/logo.svg' %}'); background-repeat: no-repeat; background-size: cover; background-position: center;" 
class="w-full h-screen flex justify-center items-center text-black font-serif leading-normal tracking-normal">
<form style="box-shadow: 0 0 20px rgba(0, 196, 255, 0.6);" method="post" 
    class="user shadow-2xl rounded-2xl md:w-[35%] sm:w-full overflow-x-hidden flex flex-col gap-4 bg-transparent border-2 border-solid border-white/20 py-6 px-10 backdrop-blur-[20px] min-h-[50vh]">
        <p class="text-center text-[40px] text-white font-bold mt-3 ">Se connecter</p>

    {% csrf_token %}
    {{form.as_p}}
    {% if messages %}
    {% for message in messages %}
        <div class="alert alert-warning">
            {{ message }}
        </div>
        {% endfor %}
    {% endif %}
    <div class= "w-full flex justify-center items-center">
        <button type="submit" 
        class="flex justify-center items-center text-xl font-bold text-white bg-blue-800 border-2 border-solid border-transparent rounded-2xl px-40 py-3 my-2 mb-6 cursor-pointer outline-none transition-all duration-300 hover:bg-transparent hover:border-white/40">Connexion</button>
    </div>
</form>

</body>
</html>
