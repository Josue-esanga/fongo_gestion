# =============================================================================
# docker-compose.yml - Orchestration Backend + Frontend + Base de données
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # Base de données PostgreSQL utilisée par le backend Django
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: fongo_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fongo_gestion
      POSTGRES_USER: fongo
      POSTGRES_PASSWORD: fongo_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fongo -d fongo_gestion"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Backend Django
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fongo_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Variables Django à adapter selon votre fichier settings.py
      DJANGO_SETTINGS_MODULE: Fongo_Gestion.settings
      PYTHONUNBUFFERED: "1"
      # Base de données
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: fongo_gestion
      DB_USER: fongo
      DB_PASSWORD: fongo_password
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
      - static_data:/app/static
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "

  # ---------------------------------------------------------------------------
  # Frontend Vite / React
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fongo_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    # Le proxy Nginx interne redirige /api vers le service backend
    environment:
      VITE_API_BASE_URL: /api

# -----------------------------------------------------------------------------
# Volumes nommés pour la persistance des données
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
  media_data:
  static_data:
