{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fongo Gestion{% endblock %}</title>
    {% tailwind_css %}
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: #f8fafc;
            color: #0f172a;
        }

        .page-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1rem;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        }

        .form-card {
            width: min(100%, 680px);
            max-width: 680px;
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid #e2e8f0;
            border-radius: 1.5rem;
            box-shadow: 0 24px 80px rgba(15, 23, 42, 0.1);
            padding: 2rem;
        }

        .form-heading {
            margin: 0 0 1rem;
            color: #0f172a;
            font-size: clamp(1.75rem, 2.1vw, 2.5rem);
            font-weight: 700;
            text-align: center;
        }

        .form-description {
            margin: 0 0 1.75rem;
            color: #475569;
            text-align: center;
            line-height: 1.75;
        }

        .form-card p {
            margin: 0 0 1rem;
        }

        .form-card label {
            display: block;
            margin-bottom: 0.5rem;
            color: #334155;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .form-card input,
        .form-card textarea,
        .form-card select {
            width: 100%;
            min-height: 3rem;
            padding: 0.95rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 1rem;
            background: #ffffff;
            color: #0f172a;
            font-size: 1rem;
            line-height: 1.5;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-card textarea {
            min-height: 140px;
            resize: vertical;
        }

        .form-card input:focus,
        .form-card textarea:focus,
        .form-card select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .form-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .btn-primary,
        .btn-secondary,
        .btn-danger {
            border: none;
            cursor: pointer;
            border-radius: 0.95rem;
            padding: 0.95rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.18);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #0f172a;
        }

        .btn-secondary:hover {
            transform: translateY(-1px);
            background: #cbd5e1;
        }

        .btn-danger {
            background: #dc2626;
            color: #ffffff;
        }

        .btn-danger:hover {
            transform: translateY(-1px);
            background: #b91c1c;
        }

        .notice {
            margin-top: 1rem;
            text-align: center;
            color: #475569;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
