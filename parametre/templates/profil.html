{% extends 'base.html' %}
{% block content %}
  <div class="max-w-5xl mx-auto bg-white p-8 rounded-2xl shadow-sm grid grid-cols-1 md:grid-cols-4 gap-8">
    <div class="flex flex-col space-y-2 border-r border-slate-100 pr-4">
      <h2 class="text-xl font-bold text-gray-800 mb-4">Réglages</h2>

      <a href="{% url 'parametres_profil' %}"
        class="text-left px-4 py-2.5 rounded-xl text-sm font-semibold transition {% if onglet_actif == 'profil' %}
          bg-purple-50 text-black
        {% else %}
          text-slate-600 hover:bg-slate-50
        {% endif %}">
        <p class="flex gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24">
	          <path d="M0 0h24v24H0z" fill="none" />
	          <path fill="currentColor" fill-rule="evenodd" d="M8 7a4 4 0 1 1 8 0a4 4 0 0 1-8 0m0 6a5 5 0 0 0-5 5a3 3 0 0 0 3 3h12a3 3 0 0 0 3-3a5 5 0 0 0-5-5z" clip-rule="evenodd" />
          </svg>
            Mon Profil
        </p>
      </a>

      <a href="{% url 'parametres_securite' %}"
        class="text-left px-4 py-2.5 rounded-xl text-sm font-semibold transition {% if onglet_actif == 'securite' %}
          bg-purple-50 text-black
        {% else %}
          text-slate-600 hover:bg-slate-50
        {% endif %}">
        <p class=" flex gap-2 "><svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24">
	            <path d="M0 0h24v24H0z" fill="none" />
	                <g fill="none">
		        <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M16 8V7a4 4 0 0 0-8 0v1" />
		        <path fill="currentColor" fill-rule="evenodd" d="M3.879 7.879C3 8.757 3 10.172 3 13v1c0 3.771 0 5.657 1.172 6.828S7.229 22 11 22h2c3.771 0 5.657 0 6.828-1.172S21 17.771 21 14v-1c0-2.828 0-4.243-.879-5.121C19.243 7 17.828 7 15 7H9c-2.828 0-4.243 0-5.121.879M12 15a1 1 0 1 0 0-2a1 1 0 0 0 0 2m3-1a3 3 0 0 1-2 2.83V19h-2v-2.17A3.001 3.001 0 1 1 15 14" clip-rule="evenodd" />
	                </g>
                </svg> Sécurité
            </p>
      </a>
    </div>

    <div class="md:col-span-3">
      <h3 class="text-lg font-bold text-slate-800 mb-1">Informations personnelles</h3>
      <p class="text-sm text-slate-500 mb-6">Mettez à jour vos coordonnées et votre photo de profil.</p>

      {% if messages %}
        {% for message in messages %}
          <div class="mb-4 p-4 text-sm text-green-700 bg-green-50 border border-green-200 rounded-xl">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post" enctype="multipart/form-data" class="space-y-5">
        {% csrf_token %}

        {{ form.as_p }}

        <div class="pt-4">
          <button type="submit" class="bg-[#03045e] hover:bg-blue-950 text-white font-semibold py-2.5 px-6 rounded-xl shadow-sm transition">Enregistrer les modifications</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
